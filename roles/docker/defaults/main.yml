---
# ==============================================================================
# Docker Role Default Variables
# ==============================================================================
# These variables can be overridden in the module's config.yml
# The playbook loads config.yml using include_vars

# Repository Configuration
docker_use_official_repo: true

# User Configuration
docker_users:
  - vagrant

# Advanced Configuration - Docker Official Repository (Debian/Ubuntu)
docker_apt_keyring_url: "https://download.docker.com/linux/debian/gpg"
docker_apt_keyring_path: "/usr/share/keyrings/docker-archive-keyring.gpg"
docker_apt_keyring_hash: "1500c1f56fa9e26b9b8f42452a553675796ade0807cdce11975eb98170b3a570"
docker_apt_repo_url: "https://download.docker.com/linux/debian"

# Advanced Configuration - Docker Official Repository (Fedora/RedHat)
docker_yum_gpg_url: "https://download.docker.com/linux/fedora/gpg"
docker_yum_repo_url: "https://download.docker.com/linux/fedora"

# Service Configuration
docker_service_enabled: true
docker_service_state: "started"
docker_verify_installation: true
